version: '3.8'

services:

  # ─── INFRASTRUCTURE ──────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [clearledger-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [clearledger-net]

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks: [clearledger-net]

  # ─── DATABASES ────────────────────────────────────────────────

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger123
    ports: ["5433:5432"]
    networks: [clearledger-net]

  income-db:
    image: postgres:16-alpine
    container_name: income-db
    environment:
      POSTGRES_DB: income_db
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger123
    ports: ["5434:5432"]
    networks: [clearledger-net]

  expense-db:
    image: postgres:16-alpine
    container_name: expense-db
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger123
    ports: ["5435:5432"]
    networks: [clearledger-net]

  debt-db:
    image: postgres:16-alpine
    container_name: debt-db
    environment:
      POSTGRES_DB: debt_db
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger123
    ports: ["5436:5432"]
    networks: [clearledger-net]

  networth-db:
    image: postgres:16-alpine
    container_name: networth-db
    environment:
      POSTGRES_DB: networth_db
      POSTGRES_USER: clearledger
      POSTGRES_PASSWORD: clearledger123
    ports: ["5437:5432"]
    networks: [clearledger-net]

  # ─── SERVICES ──────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports: ["8080:8080"]
    depends_on: [redis, user-service, income-service, expense-service, debt-service, networth-service]
    environment:
      USER_SERVICE_HOST: user-service
      INCOME_SERVICE_HOST: income-service
      EXPENSE_SERVICE_HOST: expense-service
      DEBT_SERVICE_HOST: debt-service
      NETWORTH_SERVICE_HOST: networth-service
      REDIS_HOST: redis
    networks: [clearledger-net]

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports: ["8081:8081"]
    depends_on: [users-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users_db
      SPRING_DATASOURCE_USERNAME: clearledger
      SPRING_DATASOURCE_PASSWORD: clearledger123
    networks: [clearledger-net]

  income-service:
    build:
      context: .
      dockerfile: income-service/Dockerfile
    container_name: income-service
    ports: ["8082:8082"]
    depends_on: [income-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://income-db:5432/income_db
      SPRING_DATASOURCE_USERNAME: clearledger
      SPRING_DATASOURCE_PASSWORD: clearledger123
    networks: [clearledger-net]

  expense-service:
    build:
      context: .
      dockerfile: expense-service/Dockerfile
    container_name: expense-service
    ports: ["8083:8083"]
    depends_on: [expense-db, kafka]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://expense-db:5432/expense_db
      SPRING_DATASOURCE_USERNAME: clearledger
      SPRING_DATASOURCE_PASSWORD: clearledger123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks: [clearledger-net]

  debt-service:
    build:
      context: .
      dockerfile: debt-service/Dockerfile
    container_name: debt-service
    ports: ["8084:8084"]
    depends_on: [debt-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://debt-db:5432/debt_db
      SPRING_DATASOURCE_USERNAME: clearledger
      SPRING_DATASOURCE_PASSWORD: clearledger123
    networks: [clearledger-net]

  networth-service:
    build:
      context: .
      dockerfile: networth-service/Dockerfile
    container_name: networth-service
    ports: ["8085:8085"]
    depends_on: [networth-db, redis, kafka, debt-service]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://networth-db:5432/networth_db
      SPRING_DATASOURCE_USERNAME: clearledger
      SPRING_DATASOURCE_PASSWORD: clearledger123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      DEBT_SERVICE_URL: http://debt-service:8084
    networks: [clearledger-net]

networks:
  clearledger-net:
    driver: bridge