server:
  port: 8085

spring:
  application:
    name: networth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/networth_db}
    username: ${SPRING_DATASOURCE_USERNAME:clearledger}
    password: ${SPRING_DATASOURCE_PASSWORD:clearledger123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: networth-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.clearledger.expense_service.event,com.clearledger.networth_service.event"

# Debt Service base URL — used by RestTemplate client
debt-service:
  url: ${DEBT_SERVICE_URL:http://localhost:8084}