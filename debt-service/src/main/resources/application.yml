server:
  port: 8084

spring:
  application:
    name: debt-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/debt_db}
    username: ${SPRING_DATASOURCE_USERNAME:clearledger}
    password: ${SPRING_DATASOURCE_PASSWORD:clearledger123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
