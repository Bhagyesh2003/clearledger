server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: income-service
          uri: http://${INCOME_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/income/**

        - id: expense-service
          uri: http://${EXPENSE_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/expenses/**, /api/budgets/**

        - id: debt-service
          uri: http://${DEBT_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/debts/**

        - id: networth-service
          uri: http://${NETWORTH_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/networth/**, /api/assets/**

      # Rate limiter removed from default-filters — it was intercepting
      # CORS preflight OPTIONS requests before they could be allowed through.
      # Add it back per-route later if needed.

jwt:
  secret: clearledger-super-secret-jwt-key-change-this-in-prod-min-256-bits

logging:
  level:
    org.springframework.cloud.gateway: DEBUG